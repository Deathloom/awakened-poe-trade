name: Build

on:
  push:
    branches:
      - 'master'
      - 'dev'
    tags-ignore:
      - '**'
    paths-ignore:
      - README.md

# Deathloom fork: build check only. Releases come from release.yml; this job
# never publishes (-p never) and only needs to read the repo.
permissions:
  contents: read

jobs:
  renderer:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
    - run: npm ci
      working-directory: ./renderer
    - run: npm run lint
      working-directory: ./renderer
    - run: npm run build
      working-directory: ./renderer
    - uses: actions/upload-artifact@v7
      with:
        name: renderer-dist
        path: ./renderer/dist
        retention-days: 1

  package:
    needs: renderer
    strategy:
      matrix:
        os: [windows-2022, ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        persist-credentials: false
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
    - uses: actions/download-artifact@v8
      with:
        name: renderer-dist
        path: ./renderer/dist
    - run: npm ci
      working-directory: ./main
    - run: npm run build
      working-directory: ./main
    - run: npm run package "--" -p never
      working-directory: ./main
    - name: Hash
      if: ${{ startsWith(matrix.os, 'windows') }}
      run: type .\main\dist\latest.yml
    - name: Hash
      if: ${{ startsWith(matrix.os, 'ubuntu') }}
      run: cat ./main/dist/latest-linux.yml
    - name: Hash
      if: ${{ startsWith(matrix.os, 'macos') }}
      run: cat ./main/dist/latest-mac.yml
