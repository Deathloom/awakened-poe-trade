# Deathloom fork: build the Windows installer and publish it as a GitHub release.
# Installed copies check this repo's releases and update themselves.
# Run from the Actions tab: Release -> Run workflow.
#
# Two channels:
# Branches: work is merged into dev; master only gets dev when a stable release
# is due (master = what everyone runs; running apps also read the PoB pin there).
#
# - testing: a test release x.y.z-beta.N (N counts up by itself), published as a
#   GitHub pre-release. Only copies set to Updates = Testing (Settings → General)
#   install it. Run it from dev as often as you like; CHANGELOG stays under
#   [Unreleased].
# - stable: the release for everyone. Only runs from master: merge dev into
#   master first (with [Unreleased] renamed to the version). With from_tested it
#   builds the newest x.y.z-beta.N's commit, which must already be on master.
#
# Path of Building isn't in the installer: Orbhoarder downloads it from the PoB
# fork at the commit pinned in main/src/pob/pob-pin.ts (see the PoB pin workflow).
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version x.y.z (higher than the last stable release). Testing makes x.y.z-beta.N from it.'
        required: true
      channel:
        description: 'testing = test release for Testing copies only; stable = release for everyone'
        type: choice
        options: [testing, stable]
        default: testing
      from_tested:
        description: 'Stable only: build from the commit of the newest x.y.z-beta.N test release (off = from this branch now)'
        type: boolean
        default: true
      test_build:
        description: 'Leave it as a draft release (nobody gets it). For checking the build only.'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        fetch-depth: 0
    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: 22
    - name: Work out version and commit
      id: v
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        V: ${{ inputs.version }}
        CHANNEL: ${{ inputs.channel }}
        FROM_TESTED: ${{ inputs.from_tested }}
      run: |
        [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version must look like 1.2.3"; exit 1; }
        # test releases of this version (vX.Y.Z-beta.N): numbering counts drafts too,
        # promoting uses the newest published one (drafts have no tag)
        betas () { gh release list --limit 200 "$@" --json tagName --jq '.[].tagName' | grep -E "^v${V//./\\.}-beta\.[0-9]+$" | sed -E 's/.*-beta\.//' | sort -n | tail -1 || true; }
        last=$(betas)
        tested=$(betas --exclude-drafts)
        sha="$GITHUB_SHA"
        if [[ "$CHANNEL" == "stable" && "$GITHUB_REF" != "refs/heads/master" ]]; then
          echo "Stable releases only run from master (merge dev into master first)."; exit 1
        fi
        if [[ "$CHANNEL" == "testing" ]]; then
          full="$V-beta.$(( ${last:-0} + 1 ))"
        else
          full="$V"
          if [[ "$FROM_TESTED" == "true" ]]; then
            [[ -n "$tested" ]] || { echo "No published test release $V-beta.N to promote. Run a testing release first, or untick from_tested."; exit 1; }
            sha=$(git rev-list -n 1 "v$V-beta.$tested")
            git merge-base --is-ancestor "$sha" origin/master || { echo "Tested v$V-beta.$tested (${sha::7}) isn't on master yet. Merge dev into master first, or untick from_tested."; exit 1; }
            echo "Building stable $V from tested v$V-beta.$tested ($sha)"
          fi
        fi
        if gh release view "v$full" >/dev/null 2>&1; then
          echo "Release v$full already exists. Use a higher version, or delete that release (and its tag) first."
          exit 1
        fi
        echo "full=$full" >> "$GITHUB_OUTPUT"
        echo "sha=$sha" >> "$GITHUB_OUTPUT"
        echo "Version: $full from ${sha::7}"
    - name: Check out the commit to build
      shell: bash
      env:
        SHA: ${{ steps.v.outputs.sha }}
      run: git checkout --detach "$SHA"
    - name: Create draft release
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        V: ${{ steps.v.outputs.full }}
        SHA: ${{ steps.v.outputs.sha }}
        CHANNEL: ${{ inputs.channel }}
      run: |
        if [[ "$CHANNEL" == "testing" ]]; then
          notes="Orbhoarder $V: test release (built from ${SHA::7}). Only copies with Updates = Testing install it."
          gh release create "v$V" --draft --prerelease --title "$V (test)" --target "$SHA" --notes "$notes"
        else
          gh release create "v$V" --draft --title "$V" --target "$SHA" --notes "Orbhoarder $V (built from ${SHA::7})"
        fi
    - run: npm ci
      working-directory: ./renderer
    - run: npm run build
      working-directory: ./renderer
    - run: npm ci
      working-directory: ./main
    - run: npm version "$V" --no-git-tag-version --allow-same-version
      working-directory: ./main
      shell: bash
      env:
        V: ${{ steps.v.outputs.full }}
    - run: npm run build
      working-directory: ./main
    - run: npm run package -- --win -p always
      working-directory: ./main
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    # electron-builder only writes latest.yml (its channel detection doesn't apply
    # here). Testing copies read beta.yml: the same file under that name, on test
    # and stable releases alike, so Testing copies also get stable releases.
    - name: Add beta.yml
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        V: ${{ steps.v.outputs.full }}
      run: |
        test -f main/dist/latest.yml || { echo "latest.yml not built"; exit 1; }
        if [[ ! -f main/dist/beta.yml ]]; then cp main/dist/latest.yml main/dist/beta.yml; fi
        gh release upload "v$V" main/dist/beta.yml --clobber
    - name: Publish release
      if: ${{ !inputs.test_build }}
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        V: ${{ steps.v.outputs.full }}
        CHANNEL: ${{ inputs.channel }}
      run: |
        gh release view "v$V" --json assets --jq '.assets[].name' | tee assets.txt
        grep -q '^beta.yml$' assets.txt || { echo "beta.yml missing - not publishing"; exit 1; }
        grep -q 'Setup.*\.exe$' assets.txt || { echo "installer missing - not publishing"; exit 1; }
        if [[ "$CHANNEL" == "testing" ]]; then
          # a pre-release, never "Latest": stable copies don't see it
          gh release edit "v$V" --draft=false --prerelease --latest=false
        else
          grep -q '^latest.yml$' assets.txt || { echo "latest.yml missing - not publishing"; exit 1; }
          gh release edit "v$V" --draft=false --latest
        fi
    - name: Hash
      shell: bash
      run: cat ./main/dist/*.yml
