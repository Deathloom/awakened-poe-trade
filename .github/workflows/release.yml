# Deathloom fork: build the Windows installer and publish it as a GitHub release.
# Installed copies check this repo's latest release and update themselves.
# Run from the Actions tab: Release -> Run workflow -> version (e.g. 1.0.0).
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (x.y.z, higher than the last release)'
        required: true
      pob_ref:
        description: 'Path of Building fork branch to bundle'
        required: true
        default: 'dev'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version: 22
    - name: Check version
      shell: bash
      run: |
        [[ "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version must look like 1.2.3"; exit 1; }
    - name: Create draft release
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        V="${{ inputs.version }}"
        if gh release view "v$V" >/dev/null 2>&1; then
          echo "Release v$V already exists. Use a higher version, or delete that release (and its tag) first."
          exit 1
        fi
        gh release create "v$V" --draft --title "$V" --target "$GITHUB_SHA" --notes "Loot Goblin $V (built from ${GITHUB_SHA::7})"
    - name: Bundle Path of Building (Deathloom fork)
      shell: bash
      run: |
        git clone --depth 1 --branch "${{ inputs.pob_ref }}" https://github.com/Deathloom/PathOfBuilding.git pob-src
        grep -q bundledMode pob-src/src/Launch.lua || { echo "This PoB branch has no bundled mode (PoB PR #14)"; exit 1; }
        test -f pob-src/runtime/PoBHeadless.exe
        test -f pob-src/src/ImpactServer.lua
        mkdir -p main/pob-bundle
        cp -r pob-src/src pob-src/runtime main/pob-bundle/
        cp pob-src/manifest.xml pob-src/LICENSE.md pob-src/changelog.txt pob-src/help.txt main/pob-bundle/
        # bundled.cfg switches PoB to bundled mode: no own updater, data in Documents\Loot Goblin
        touch main/pob-bundle/src/bundled.cfg
        POB_SHA=$(git -C pob-src rev-parse --short HEAD)
        echo "$POB_SHA" > main/pob-bundle/pob-commit.txt
        gh release edit "v${{ inputs.version }}" --notes "Loot Goblin ${{ inputs.version }} (built from ${GITHUB_SHA::7}), with Path of Building ${{ inputs.pob_ref }}@$POB_SHA"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - run: npm ci
      working-directory: ./renderer
    - run: npm run build
      working-directory: ./renderer
    - run: npm ci
      working-directory: ./main
    - run: npm version ${{ inputs.version }} --no-git-tag-version --allow-same-version
      working-directory: ./main
    - run: npm run build
      working-directory: ./main
    - run: npm run package -- --win -p always
      working-directory: ./main
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Publish release
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        V="${{ inputs.version }}"
        gh release view "v$V" --json assets --jq '.assets[].name' | tee assets.txt
        grep -q '^latest.yml$' assets.txt || { echo "latest.yml missing - not publishing"; exit 1; }
        grep -q 'Setup.*\.exe$' assets.txt || { echo "installer missing - not publishing"; exit 1; }
        gh release edit "v$V" --draft=false --latest
    - name: Hash
      run: type .\main\dist\latest.yml
