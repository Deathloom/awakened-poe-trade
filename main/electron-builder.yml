# Deathloom fork: own identity (installs, settings and updates separate from
# upstream Awakened PoE Trade) and updates from Deathloom's GitHub releases.
publish:
  - provider: "github"
    owner: "Deathloom"
    repo: "awakened-poe-trade"
    releaseType: "release"
appId: "com.deathloom.poe-builds-toolkit"
productName: "POE Builds Toolkit"
npmRebuild: false
toolsets:
  appimage: 1.0.3
artifactBuildCompleted: "build/apprun-patch.test.mjs"
files:
  - "package.json"
  - from: "dist"
    to: "."
    filter: ["main.js", "vision.js"]
  - from: "../renderer/dist"
    to: "."
extraMetadata:
  main: "main.js"
  name: "poe-builds-toolkit"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
win:
  # nsis only: the portable exe can't auto-update
  target:
  - "nsis"
linux:
  target:
  - "AppImage"
mac:
  target:
  - target: "dmg"
    arch:
    - "universal"
  identity: null
  x64ArchFiles: "*"
