# Deathloom fork: own identity (installs, settings and updates separate from
# upstream Awakened PoE Trade) and updates from Deathloom's GitHub releases.
publish:
  - provider: "github"
    owner: "Deathloom"
    repo: "awakened-poe-trade"
    # The Release workflow creates the draft first and publishes it after the
    # upload (parallel uploads otherwise race to create the release)
    releaseType: "draft"
appId: "com.deathloom.loot-goblin"
productName: "Loot Goblin"
npmRebuild: false
toolsets:
  appimage: 1.0.3
artifactBuildCompleted: "build/apprun-patch.test.mjs"
files:
  - "package.json"
  - from: "dist"
    to: "."
    filter: ["main.js", "vision.js"]
  - from: "../renderer/dist"
    to: "."
extraMetadata:
  main: "main.js"
  name: "loot-goblin"
nsis:
  # Deathloom fork: moves the PoB copy older versions had in resources\PathOfBuilding
  # to %LOCALAPPDATA%\Loot Goblin\PathOfBuilding on update; removes it on uninstall
  include: "build/installer.nsh"
  oneClick: false
  allowToChangeInstallationDirectory: true
win:
  # nsis only: the portable exe can't auto-update
  target:
  - "nsis"
linux:
  target:
  - "AppImage"
mac:
  target:
  - target: "dmg"
    arch:
    - "universal"
  identity: null
  x64ArchFiles: "*"
