# Deathloom fork: own identity (installs, settings and updates separate from
# upstream Awakened PoE Trade) and updates from Deathloom's GitHub releases.
publish:
  - provider: "github"
    owner: "Deathloom"
    repo: "awakened-poe-trade"
    # The Release workflow creates the draft first and publishes it after the
    # upload (parallel uploads otherwise race to create the release)
    releaseType: "draft"
appId: "com.deathloom.loot-goblin"
# Deathloom fork: renamed to Orbhoarder (15 Nov 2026). productName stays, so the
# install folder, the .exe and the settings folder (%APPDATA%) don't move and
# updates keep working; what people see uses the new name.
productName: "Loot Goblin"
artifactName: "Orbhoarder-Setup-${version}.${ext}"
npmRebuild: false
# Deathloom fork (F2 security review): the installed exe can't be turned into a
# plain Node runner (ELECTRON_RUN_AS_NODE), take NODE_OPTIONS, or open a debug
# port (--inspect). Cookies and asar loading are left as they were.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
toolsets:
  appimage: 1.0.3
artifactBuildCompleted: "build/apprun-patch.test.mjs"
files:
  - "package.json"
  - from: "dist"
    to: "."
    filter: ["main.js", "vision.js"]
  - from: "../renderer/dist"
    to: "."
extraMetadata:
  main: "main.js"
  name: "loot-goblin"
nsis:
  # Deathloom fork: moves the PoB copy older versions had in resources\PathOfBuilding
  # to %LOCALAPPDATA%\Loot Goblin\PathOfBuilding on update; removes it on uninstall
  include: "build/installer.nsh"
  oneClick: false
  shortcutName: "Orbhoarder"
  uninstallDisplayName: "Orbhoarder"
  allowToChangeInstallationDirectory: true
win:
  # nsis only: the portable exe can't auto-update
  target:
  - "nsis"
linux:
  target:
  - "AppImage"
mac:
  target:
  - target: "dmg"
    arch:
    - "universal"
  identity: null
  x64ArchFiles: "*"
